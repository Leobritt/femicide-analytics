# Tema do dashboard. As cores seguem a mesma paleta dos gráficos (azul = destaque,
# laranja = crimes letais), com tons próprios para o modo claro e para o escuro.
# O Streamlit segue a preferência do sistema; o usuário troca em ⋮ (System / Light / Dark).

[client]
toolbarMode = "viewer"       # menu ⋮ só com opções de quem visualiza (tema claro/escuro), sem o botão "Deploy"
showSidebarNavigation = false

[theme]
baseRadius = "0.6rem"
showWidgetBorder = true
metricValueFontSize = "2.1rem"
metricValueFontWeight = 600
headingFontWeights = [700, 600, 600, 600, 600, 600]

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f2f1ee"
textColor = "#0b0b0b"
borderColor = "#dddcd7"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
chartSequentialColors = ["#eef5fd", "#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#5598e7", "#3987e5", "#256abf", "#184f95", "#0d366b"]

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#252523"
textColor = "#f0efec"
borderColor = "#383835"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
chartSequentialColors = ["#202a38", "#16335a", "#104281", "#184f95", "#1c5cab", "#256abf", "#3987e5", "#5598e7", "#86b6ef", "#cde2fb"]
